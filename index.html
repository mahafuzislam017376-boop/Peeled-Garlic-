<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALIVON – Premium Peeled Garlic | খোসা ছাড়ানো রসুন</title>
<meta name="description" content="ALIVON: দেশি ও আমদানি করা খোসা ছাড়ানো রসুন, ২৫০ গ্রাম থেকে ১০ কেজি পর্যন্ত।">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
:root{--g:#0E3324;--g2:#082016;--gold:#C8A24E;--gold2:#E6CB8A;--cream:#F6F0E1;--ink:#14201A;--mut:#5d6b62;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16px/1.65 "Hind Siliguri",system-ui,sans-serif}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;line-height:1.08;margin:0}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--g2);color:var(--cream);display:flex;align-items:center;gap:16px;padding:10px 20px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--g2);z-index:30}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:26px;letter-spacing:.14em;color:var(--gold2)}
.brand img{height:34px;width:34px;border-radius:50%;object-fit:cover;object-position:center 45%;background:var(--cream)}
nav{margin-left:auto;display:flex;gap:18px;align-items:center}
nav a{text-decoration:none;font-size:15px;opacity:.85}
nav a:hover{opacity:1;color:var(--gold2)}
.cartbtn{background:var(--gold);color:var(--g2);border:0;border-radius:99px;padding:6px 16px;font-weight:600}
@media(max-width:760px){nav a.h{display:none}header{padding:8px 14px}.brand{font-size:22px}}
.hero{background:radial-gradient(ellipse at 70% 40%,#1b5a3f 0,var(--g) 45%,var(--g2) 100%);color:var(--cream);padding:56px 20px 72px;overflow:hidden}
.hw{max-width:1100px;margin:auto;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.hero h1{font-size:clamp(46px,8vw,92px);letter-spacing:.01em}
.hero h1 span{display:block;color:var(--gold2)}
.hero p{max-width:34ch;font-size:18px;opacity:.92;margin:18px 0 26px}
.btn{display:inline-block;border:1.5px solid var(--gold);border-radius:99px;padding:11px 26px;text-decoration:none;font-weight:600;background:none;color:inherit}
.btn.f{background:var(--gold);color:var(--g2)}
.btn:hover{transform:translateY(-2px)}
.stage{perspective:1000px;height:480px;position:relative;display:grid;place-items:center}
.pack{width:270px;transform-style:preserve-3d;transition:transform .15s;animation:fl 6s ease-in-out infinite}
.pack img.lab{width:100%;border-radius:150px 150px 18px 18px;box-shadow:0 40px 60px rgba(0,0,0,.5),0 0 0 2px var(--gold)}
.pack .c{position:absolute;border-radius:50%;object-fit:cover;border:3px solid var(--cream);box-shadow:0 20px 30px rgba(0,0,0,.4)}
.c1{width:130px;height:130px;left:-80px;bottom:30px;transform:translateZ(90px);animation:fl 5s -1s ease-in-out infinite}
.c2{width:96px;height:96px;right:-60px;top:70px;transform:translateZ(120px);animation:fl 7s -3s ease-in-out infinite}
@keyframes fl{50%{translate:0 -14px}}
@media(max-width:760px){.hw{grid-template-columns:1fr}.stage{height:400px}.pack{width:220px}.c1{left:-50px;width:100px;height:100px}.c2{right:-35px;width:76px;height:76px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
section{padding:64px 20px}
.w{max-width:1100px;margin:auto}
h2{font-size:clamp(34px,5vw,52px);color:var(--g)}
.sub{color:var(--mut);margin:8px 0 26px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.chip{border:1.5px solid var(--g);background:none;color:var(--g);border-radius:99px;padding:6px 18px;font-weight:500}
.chip.on{background:var(--g);color:var(--cream)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(14,51,36,.12);display:flex;flex-direction:column;transition:transform .2s;transform-style:preserve-3d}
.card:hover{transform:translateY(-4px) rotateX(2deg)}
.card .im{aspect-ratio:1;background:#eee;cursor:pointer;position:relative}
.card .im img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:10px;top:10px;background:var(--g);color:var(--gold2);font-size:13px;padding:2px 12px;border-radius:99px}
.tag.s{background:#7a2b1f;color:#fff;left:auto;right:10px}
.card .b{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{font-size:24px;color:var(--g)}
.pr{font-size:26px;font-weight:600;color:var(--g)}
.pr small{font-size:13px;color:var(--mut);font-weight:400;display:block}
.ws{display:flex;flex-wrap:wrap;gap:6px}
.ws button{border:1px solid #c9c2ad;background:#fff;border-radius:6px;padding:2px 10px;font-size:14px}
.ws button.on{background:var(--gold);border-color:var(--gold);font-weight:600}
.row{display:flex;gap:8px;align-items:center;margin-top:auto}
.q{display:inline-flex;border:1px solid #c9c2ad;border-radius:6px}
.q button{border:0;background:none;width:30px;font-size:18px}
.q span{min-width:28px;text-align:center;align-self:center}
.add{flex:1;background:var(--g);color:var(--cream);border:0;border-radius:6px;padding:8px}
.add:disabled{opacity:.4}
.demo{font-size:12px;color:#8a6a1f}
.pk{background:var(--g2);color:var(--cream)}
.pk h2{color:var(--gold2)}
.pk .sub{color:#b9c7bd}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;perspective:900px}
.tile{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:3/4;transition:transform .5s;transform-style:preserve-3d}
.tile:hover{transform:rotateY(-18deg) rotateX(4deg) scale(1.04)}
.tile img{width:100%;height:100%;object-fit:cover}
.tile b{position:absolute;left:0;bottom:0;right:0;padding:26px 10px 8px;background:linear-gradient(transparent,rgba(8,32,22,.92));font-family:"Cormorant Garamond",serif;font-size:28px;color:var(--gold2)}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
.ab img{border-radius:10px;box-shadow:0 20px 40px rgba(14,51,36,.25)}
@media(max-width:760px){.ab{grid-template-columns:1fr}}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;margin-top:40px;border-top:2px solid var(--gold)}
.why div{padding:18px 18px 0 0}
.why h3{font-size:24px;color:var(--g)}
.why p{margin:6px 0;color:var(--mut);font-size:15px}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:36px}
@media(max-width:760px){.ct{grid-template-columns:1fr}}
input,textarea,select{font:inherit;width:100%;padding:9px 12px;border:1.5px solid #c9c2ad;border-radius:6px;background:#fff;margin:4px 0 12px}
label{font-size:14px;color:var(--mut)}
footer{background:var(--g2);color:var(--cream);padding:40px 20px;text-align:center}
footer .serif{font-size:30px;letter-spacing:.14em;color:var(--gold2)}
footer nav{justify-content:center;flex-wrap:wrap;margin:14px 0}
footer small{opacity:.7}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;background:#25D366;color:#fff;border-radius:99px;padding:12px 20px;text-decoration:none;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;background:rgba(8,32,22,.7);z-index:40;display:none;align-items:center;justify-content:center;padding:14px}
.ov.on{display:flex}
.md{background:var(--cream);border-radius:12px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:22px;position:relative}
.md .x{position:absolute;right:12px;top:8px;border:0;background:none;font-size:30px}
.dr{justify-content:flex-end;padding:0}
.dr .md{max-width:420px;height:100%;max-height:none;border-radius:0}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:640px){.pd{grid-template-columns:1fr}}
.zm{aspect-ratio:1;overflow:hidden;border-radius:8px;cursor:zoom-in;background:#ddd}
.zm img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.zm:hover img{transform:scale(2)}
.th{display:flex;gap:8px;margin-top:8px}
.th img{width:58px;height:58px;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer}
.th img.on{border-color:var(--gold)}
.ci{display:grid;grid-template-columns:56px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid #d9d2bd;align-items:center}
.ci img{width:56px;height:56px;object-fit:cover;border-radius:6px}
.ci select{padding:3px;margin:4px 0}
.msg{white-space:pre-wrap;background:#fff;border-radius:8px;padding:12px;font-size:14px;border:1px dashed var(--gold)}
.ar{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr auto;gap:6px;align-items:end;border-bottom:1px solid #d9d2bd;padding:8px 0}
.ar input,.ar select{margin:0;padding:6px}
@media(max-width:640px){.ar{grid-template-columns:1fr 1fr}}
.toast{position:fixed;left:50%;bottom:80px;translate:-50% 0;background:var(--g);color:var(--cream);padding:8px 18px;border-radius:99px;z-index:60;display:none}

.pack img.lab{border-radius:0;box-shadow:none;filter:drop-shadow(0 34px 34px rgba(0,0,0,.55))}
.pack::before,.pack::after{content:"";position:absolute;inset:0;border-radius:135px 135px 14px 14px;background:linear-gradient(#b8943f,#5e4a1c)}
.pack::before{transform:translateZ(-8px)}.pack::after{transform:translateZ(-16px);background:#3d2f10}
.pack .sh{position:absolute;inset:0;border-radius:135px 135px 14px 14px;background:radial-gradient(circle at var(--sx,50%) var(--sy,40%),rgba(255,236,170,.42),transparent 46%);mix-blend-mode:screen;pointer-events:none;transform:translateZ(2px)}
.stage{touch-action:pan-y}
.stage::after{content:"";position:absolute;bottom:14px;width:230px;height:26px;background:radial-gradient(#000b,transparent 70%);filter:blur(6px)}
.hero{position:relative}.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(230,203,138,.5) 0 1.5px,transparent 2px) 0 0/90px 90px,radial-gradient(circle,rgba(230,203,138,.3) 0 1px,transparent 2px) 30px 45px/60px 60px;animation:dust 40s linear infinite}
@keyframes dust{to{background-position:0 -360px,30px -135px}}
.hw{position:relative}
.card{position:relative;will-change:transform}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0),rgba(255,255,255,.3),transparent 55%);opacity:0;transition:opacity .2s}
.card:hover::after{opacity:1}
.grid{perspective:1200px}
